<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NotifAi News — Article</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header header-areas">
    <!-- Row 1: brand (left) + actions (right) -->
    <div class="brand">
      <a href="./index.html" class="brand-link" aria-label="NotifAi News">
        <img src="./logo.jpeg" alt="NotifAi" class="brand-logo" />
        <span class="sr-only">NotifAi News</span>
      </a>
    </div>

    <div class="actions">
      <a class="nav-link" href="./about.html">About</a>
      <a class="nav-link" href="https://x.com/notifainews" target="_blank" rel="noopener" aria-label="NotifAi on X">X</a>
      <a class="nav-link" href="./index.html">Home</a>
    </div>

    <!-- Row 2: single back button (keeps layout consistent with index) -->
    <nav class="main-nav">
      <a class="nav-btn" href="./index.html">← Back</a>
    </nav>
  </header>

  <main class="container article-view">
    <h1 id="title" class="a-title"></h1>
    <div class="byline">
      <span id="source"></span>
      <span class="dot">•</span>
      <time id="when"></time>
    </div>

    <div class="hero">
      <!-- Clicking hero image opens original source -->
      <a id="sourceLinkImage" href="#" target="_blank" rel="noopener">
        <img id="hero" src="/cover.jpg" alt="" onerror="this.onerror=null;this.src='/cover.jpg';" />
      </a>
    </div>

    <!-- “Full News Article” button directly below the image -->
    <div class="full-article-row">
      <a id="fullLink" class="full-link" href="#" target="_blank" rel="noopener">Full News Article</a>
    </div>

    <section class="summary-block">
      <h2>Summary</h2>
      <p id="summary"></p>
    </section>

    <section class="debate">
      <h2>Perspectives</h2>
      <div class="voices">
        <div class="voice">
          <h3>Jessica Rebella</h3>
          <p id="v-socialist"></p>
        </div>
        <div class="voice">
          <h3>John Davis</h3>
          <p id="v-rightwing"></p>
        </div>
        <div class="voice">
          <h3>Joe Musk</h3>
          <p id="v-conspiracy"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> NotifAi News</div>
    <a href="https://x.com/notifainews" target="_blank" rel="noopener">Follow on X</a>
  </footer>

  <script type="module" src="./article.js"></script>
</body>
</html>
