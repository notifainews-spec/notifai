<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NotifAi News — Article</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XKHQTRV8JF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XKHQTRV8JF');
  </script>

  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Single header: logo (left) + Home + Hamburger -->
  <header class="site-header">
    <div class="brand">
      <a href="./index.html" class="brand-link" aria-label="NotifAi News">
        <img src="./logo.jpeg" alt="NotifAi" class="brand-logo" />
      </a>
    </div>

    <nav class="main-nav">
      <a class="nav-btn" href="./index.html">Home</a>
    </nav>

    <!-- Hamburger -->
    <button id="hamburger" class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="siteMenu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Slide-over menu -->
  <div id="menuOverlay" class="menu-overlay" hidden></div>
  <aside id="siteMenu" class="menu-sheet" aria-hidden="true">
    <button id="menuClose" class="menu-close" aria-label="Close menu">✕</button>
    <nav class="menu-links">
      <a href="./about.html">About</a>
      <a href="./contact.html">Contact</a>
      <a href="https://x.com/notifaibnb" target="_blank" rel="noopener">X</a>
      <a href="https://dexscreener.com/bsc/0x70131b713a5d0e9d900feca15d0e1348658e4444" target="_blank" rel="noopener">Dexscreener</a>
    </nav>
  </aside>

  <main class="container article-view">
    <h1 id="title" class="a-title"></h1>
    <div class="byline">
      <span id="source"></span>
      <span class="dot">•</span>
      <time id="when"></time>
    </div>

    <div class="hero">
      <a id="sourceLinkImage" href="#" target="_blank" rel="noopener">
        <img id="hero" src="/cover.jpg" alt="" onerror="this.onerror=null;this.src='/cover.jpg';" />
      </a>
    </div>

    <div class="full-article-row">
      <a id="fullLink" class="full-link" href="#" target="_blank" rel="noopener">Full News Article</a>
    </div>

    <div class="share-row">
      <span class="share-label">Share:</span>
      <a id="share-wa" class="share-btn" target="_blank" rel="noopener" href="#">WhatsApp</a>
      <a id="share-x"  class="share-btn" target="_blank" rel="noopener" href="#">X</a>
      <a id="share-fb" class="share-btn" target="_blank" rel="noopener" href="#">Facebook</a>
    </div>

    <section class="summary-block">
      <h2>Summary</h2>
      <p id="summary"></p>
    </section>

    <details id="perspectives" class="perspectives">
      <summary>Show perspectives</summary>
      <div class="voices">
        <div class="voice">
          <h3>Jessica Rebella</h3>
          <p id="v-socialist"></p>
        </div>
        <div class="voice">
          <h3>John Davis</h3>
          <p id="v-rightwing"></p>
        </div>
        <div class="voice">
          <h3>Joe Musk</h3>
          <p id="v-conspiracy"></p>
        </div>
      </div>
    </details>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> NotifAi News</div>
    <a href="contact.html">Contact</a>
    <a href="https://x.com/notifaibnb" target="_blank" rel="noopener">Follow on X</a>
  </footer>

  <script type="module" src="./article.js"></script>
  <script type="module" src="./menu.js"></script>
</body>
</html>
