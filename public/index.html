<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NotifAi News</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- GA4 (keep your ID) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XKHQTRV8JF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date()); gtag('config', 'G-XKHQTRV8JF');
  </script>

  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Sticky header -->
  <header class="site-header">
    <!-- Row 1: Logo (center) + Hamburger (right) -->
    <div class="brand">
      <a href="./index.html" class="brand-link" aria-label="NotifAi News">
        <img src="./logo.jpeg" alt="NotifAi" class="brand-logo" />
      </a>
    </div>
    <button id="hamburger" class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="siteMenu">
      <span></span><span></span><span></span>
    </button>

    <!-- Row 2: Categories (single-line, scrollable on small screens) -->
    <nav id="catBar" class="main-nav" aria-label="Categories">
      <button data-cat="us" class="nav-btn active">US</button>
      <button data-cat="world" class="nav-btn">World</button>
      <button data-cat="entertainment" class="nav-btn">Entertainment</button>
      <button data-cat="finance" class="nav-btn">Finance</button>
      <button data-cat="crypto" class="nav-btn">Crypto</button>
    </nav>
  </header>

  <!-- Slide-over menu -->
  <div id="menuOverlay" class="menu-overlay" hidden></div>
  <aside id="siteMenu" class="menu-sheet" aria-hidden="true">
    <button id="menuClose" class="menu-close" aria-label="Close menu">✕</button>
    <nav class="menu-links">
      <a href="./about.html">About</a>
      <a href="./contact.html">Contact</a>
      <a href="https://x.com/notifaibnb" target="_blank" rel="noopener">X</a>
      <a href="https://dexscreener.com/bsc/0x70131b713a5d0e9d900feca15d0e1348658e4444" target="_blank" rel="noopener">Dexscreener</a>
    </nav>
  </aside>

  <main class="container">
    <div id="notice" class="notice" hidden></div>

    <!-- Story mode (mobile) -->
    <section id="storyMode" aria-live="polite" hidden></section>

    <!-- Top story / hero -->
    <section id="hero" class="hero-block" hidden></section>

    <!-- Cards grid -->
    <div id="grid" class="grid"></div>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> NotifAi News</div>
    <div class="footer-links">
      <a href="./about.html">About</a>
      <a href="./contact.html">Contact</a>
      <a href="https://x.com/notifaibnb" target="_blank" rel="noopener">X</a>
      <a href="https://dexscreener.com/bsc/0x70131b713a5d0e9d900feca15d0e1348658e4444" target="_blank" rel="noopener">Dexscreener</a>
    </div>
  </footer>

  <!-- If your API is remote, set it here: -->
  <!-- <script>window.API_BASE="https://YOUR-SERVICE.onrender.com";</script> -->

  <!-- Your app logic (unchanged) -->
  <script type="module" src="./app.js"></script>
  <!-- Menu toggler (if you already have one, keep it) -->
  <script type="module">
    const overlay = document.getElementById('menuOverlay');
    const sheet   = document.getElementById('siteMenu');
    const openBtn = document.getElementById('hamburger');
    const closeBtn= document.getElementById('menuClose');

    function openMenu(){
      openBtn.classList.add('active');
      sheet.classList.add('open');
      overlay.hidden = false;
      sheet.setAttribute('aria-hidden','false');
      openBtn.setAttribute('aria-expanded','true');
    }
    function closeMenu(){
      openBtn.classList.remove('active');
      sheet.classList.remove('open');
      overlay.hidden = true;
      sheet.setAttribute('aria-hidden','true');
      openBtn.setAttribute('aria-expanded','false');
    }
    openBtn?.addEventListener('click', ()=> {
      const isOpen = sheet.classList.contains('open');
      isOpen ? closeMenu() : openMenu();
    });
    overlay?.addEventListener('click', closeMenu);
    closeBtn?.addEventListener('click', closeMenu);

    // footer year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
