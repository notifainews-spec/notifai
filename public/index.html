<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NotifAi News</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="wrap header-wrap">
      <div class="brand">
        <a href="/" class="logo" aria-label="NotifAi News">
          <!-- Use your PNG if you have it; falls back to text if image missing -->
          <img src="/logo.png" alt="NotifAi News" onerror="this.replaceWith(document.createTextNode('NotifAi News'));">
        </a>
      </div>
    </div>

    <!-- Category bar (US pill -> region dropdown) -->
    <nav id="catBar" class="main-nav">
      <div class="nav-dropdown" id="regionDrop">
        <button class="nav-btn active" id="usBtn" data-cat="us" aria-haspopup="listbox" aria-expanded="false">
          <span class="label" id="regionCode">US</span>
          <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <ul id="regionMenu" class="nav-dropmenu" role="listbox" aria-label="Choose region"></ul>
      </div>

      <button class="nav-btn" data-cat="entertainment">Entertainment</button>
      <button class="nav-btn" data-cat="finance">Finance</button>
      <button class="nav-btn" data-cat="world">World</button>
      <button class="nav-btn" data-cat="crypto">Crypto</button>
    </nav>
  </header>

  <!-- Main -->
  <main class="page">
    <section id="hero"></section>
    <section id="grid" class="grid"></section>
    <section id="storyMode" class="story-mode" hidden></section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="wrap footer-wrap">
      <div class="footer-left">© <span id="year"></span> NotifAi News</div>
      <nav class="footer-links">
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
        <a href="https://x.com/notifainews" target="_blank" rel="noopener">X</a>
        <a href="https://dexscreener.com/bsc/0x70131b713a5d0e9d900feca15d0e1348658e4444" target="_blank" rel="noopener">Dexscreener</a>
        <a href="javascript:void(0)" id="donateLink" title="Donate in BNB">Donate</a>
      </nav>
    </div>
  </footer>

  <!-- First-visit region modal -->
  <div id="regionModal" class="region-modal" hidden>
    <div class="region-card" role="dialog" aria-modal="true" aria-labelledby="regionTitle">
      <h3 id="regionTitle">Select your local news</h3>
      <p>Pick a country to personalize Politics / Finance / Entertainment.</p>
      <div class="region-grid">
        <button data-region="us">USA</button>
        <button data-region="cn">China</button>
        <button data-region="pk">Pakistan</button>
        <button data-region="id">Indonesia</button>
        <button data-region="uk">United Kingdom</button>
      </div>
    </div>
  </div>

  <script>window.API_BASE = location.origin;</script>
  <script type="module" src="/app.js"></script>

  <!-- Optional: if you have a donate() function somewhere else, leave this out.
       This fallback opens your contract on BscScan so users can send BNB manually. -->
  <script>
    const DONATE_CONTRACT = "0x6a98b87f8116678ed98f74ae9a638bf30ebf3846";
    document.addEventListener('DOMContentLoaded', () => {
      const link = document.getElementById('donateLink');
      if (!link) return;
      link.addEventListener('click', () => {
        // fallback: open contract page; if you want Metamask flow, plug it here.
        window.open(`https://bscscan.com/address/${DONATE_CONTRACT}`, "_blank", "noopener");
      });
    });
  </script>
</body>
</html>
