<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NotifAi News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.png" type="image/png">
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <!-- Brand (image with text fallback — JS will show only one) -->
    <div class="brand" id="brand">
      <a class="brand-link" href="/">
        <img src="/logo.jpeg" alt="NotifAi News" class="brand-logo logo-img" width="112" height="28">
        <span class="logo-text">NotifAi News</span>
      </a>
    </div>

    <!-- Categories (center). US has a dropdown for regions -->
    <nav class="main-nav" id="catBar" aria-label="Primary">
      <div class="nav-dropdown" id="regionDrop">
        <button id="usBtn" type="button" class="nav-btn" aria-expanded="false">
          <span id="regionCode">US</span>
          <svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7l5 6 5-6z"></path></svg>
        </button>
        <ul id="regionMenu" class="nav-dropmenu" role="menu" aria-label="Choose region"><!-- filled by JS --></ul>
      </div>

      <button type="button" class="nav-btn" data-cat="world">World</button>
      <button type="button" class="nav-btn" data-cat="entertainment">Entertainment</button>
      <button type="button" class="nav-btn" data-cat="finance">Finance</button>
      <button type="button" class="nav-btn" data-cat="crypto">Crypto</button>
    </nav>

    <!-- Right side actions (kept minimal; footer has the full list) -->
    <div class="actions">
      <a class="nav-link" href="/about.html">About</a>
      <a class="nav-link" href="/contact.html">Contact</a>
      <a class="nav-link" href="https://x.com/notifainews" target="_blank" rel="noopener">X</a>
      <a class="nav-link dexscreener" href="https://dexscreener.com/bsc/0x70131b713a5d0e9d900feca15d0e1348658e4444" target="_blank" rel="noopener">Dexscreener</a>
    </div>
  </header>

  <main class="container">
    <!-- Notice (optional) -->
    <div id="notice" class="notice" hidden></div>

    <!-- Top Story -->
    <section id="hero" class="hero-block" hidden></section>

    <!-- Cards Grid -->
    <section id="grid" class="grid" aria-live="polite"></section>

    <!-- Story Mode (mobile) -->
    <section id="storyMode" aria-hidden="true"></section>
    <div id="storyNext" role="button" aria-label="Next story">
      <span>Next story</span><span class="arrow" aria-hidden="true"></span>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-left">© <span id="year"></span> NotifAi News</div>
      <nav class="footer-right" aria-label="Footer">
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
        <a href="https://x.com/notifainews" target="_blank" rel="noopener">X</a>
        <a href="https://dexscreener.com/bsc/0x70131b713a5d0e9d900feca15d0e1348658e4444" target="_blank" rel="noopener">Dexscreener</a>
        <a href="#" id="donateBtn">Donate</a>
      </nav>
    </div>
  </footer>

  <!-- ===== First-visit Region Modal (appears once, then remembers) ===== -->
  <div id="regionModal" class="region-modal" hidden>
    <div class="region-card" role="dialog" aria-modal="true" aria-labelledby="regionTitle">
      <h3 id="regionTitle">Pick your local news</h3>
      <p>Choose a country for local political, finance and entertainment. You can change it later.</p>
      <div class="region-grid">
        <button type="button" data-region="us">United States (US)</button>
        <button type="button" data-region="cn">China (CN)</button>
        <button type="button" data-region="pk">Pakistan (PK)</button>
        <button type="button" data-region="id">Indonesia (ID)</button>
        <button type="button" data-region="uk">United Kingdom (UK)</button>
      </div>
      <p class="muted" style="margin-top:12px">Tap outside to keep US.</p>
    </div>
  </div>

  <!-- (Optional) Ethers for Donate if you kept the button wired client-side -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js" defer></script>

  <script>
    // Simple year in footer
    document.getElementById('year').textContent = new Date().getFullYear();
    // Provide API_BASE to app.js if you’re on a static CDN pointing to a different API
    window.API_BASE = window.API_BASE || location.origin;
  </script>
  <script src="/app.js" defer></script>
</body>
</html>
