<!-- Ethers.js (browser) -->
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>

<script>
(function(){
  // Your deployed BSC donation contract
  const CONTRACT = "0x6a98b87f8116678ed98f74ae9a638bf30ebf3846";

  // Simple event delegation helper
  function on(elem, evt, sel, fn){
    elem.addEventListener(evt, e => {
      const t = e.target.closest(sel);
      if (t) fn(e, t);
    });
  }

  async function donateFlow(defaultAmt="0.01"){
    try{
      if (!window.ethereum){
        alert("Please install MetaMask (or a compatible wallet) to donate via BNB.");
        return;
      }
      // Ask user how much BNB
      const amount = prompt("Enter BNB amount to donate:", defaultAmt);
      if (!amount) return;

      // Request accounts & send
      const provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      const signer = await provider.getSigner();

      const tx = await signer.sendTransaction({
        to: CONTRACT,
        value: ethers.parseEther(String(amount))
      });

      alert("Thank you! Donation sent. Tx: " + tx.hash);
    } catch(err){
      console.error(err);
      alert("Donation failed: " + (err?.message || err));
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    on(document, "click", "[data-donate]", (e)=>{ e.preventDefault(); donateFlow(); });
  });
})();
</script>
