<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NotifAi News</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header header-areas">
    <!-- Row 1: brand (left) + actions (right) -->
    <div class="brand">
      <a href="./index.html" class="brand-link" aria-label="NotifAi News">
        <img src="./logo.jpeg" alt="NotifAi" class="brand-logo" />
        <span class="sr-only">NotifAi News</span>
      </a>
    </div>

    <div class="actions">
      <a class="nav-link" href="./about.html">About</a>
      <a class="nav-link" href="https://x.com/notifainews" target="_blank" rel="noopener" aria-label="NotifAi on X">X</a>
      <button id="refreshBtn" title="Fetch latest">↻ Refresh</button>
    </div>

    <!-- Row 2: categories centered and bigger -->
    <nav class="main-nav">
      <button data-cat="us" class="nav-btn active">US</button>
      <button data-cat="world" class="nav-btn">World</button>
      <button data-cat="entertainment" class="nav-btn">Entertainment</button>
      <button data-cat="finance" class="nav-btn">Finance</button>
    </nav>
  </header>

  <main class="container">
    <div id="notice" class="notice" hidden></div>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> NotifAi News</div>
    <a href="https://x.com/notifainews" target="_blank" rel="noopener">Follow on X</a>
  </footer>

  <!-- If your API is on Render/elsewhere, uncomment and set this: -->
  <!-- <script>window.API_BASE="https://YOUR-RENDER.onrender.com";</script> -->
  <script type="module" src="./app.js"></script>
</body>
</html>
