<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NotifAi News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="brand" id="brand">
      <a class="brand-link" href="/">
        <img class="brand-logo logo-img" src="/logo.jpeg" alt="NotifAi" onerror="this.style.display='none';document.querySelector('.logo-text').style.display='inline-block';">
        <span class="logo-text" style="display:none">NotifAi News</span>
      </a>
    </div>

    <!-- Categories (no region dropdown here anymore) -->
    <nav class="main-nav" id="categoryBar">
      <button class="nav-btn" data-cat="us">Politics</button>
      <button class="nav-btn" data-cat="finance">Finance</button>
      <button class="nav-btn" data-cat="entertainment">Entertainment</button>
      <button class="nav-btn" data-cat="world">World</button>
      <button class="nav-btn" data-cat="crypto">Crypto</button>
    </nav>

    <!-- Right-side menu toggle -->
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <span class="menu-lines"></span>
    </button>
  </header>

  <main class="container">
    <div class="notice" id="notice" hidden></div>

    <!-- Hero -->
    <section id="hero" class="hero-block" hidden>
      <a id="heroLink" class="hero-media" href="#">
        <img id="heroImg" alt="">
        <div class="hero-overlay">
          <div class="hero-info">
            <div class="hero-kicker" id="heroKicker">Top story</div>
            <h1 class="hero-title" id="heroTitle"></h1>
            <div class="hero-actions">
              <a class="btn" id="heroRead" href="#">Read article</a>
            </div>
          </div>
        </div>
      </a>
    </section>

    <!-- Cards -->
    <section id="grid" class="grid"></section>

    <!-- Story Mode (mobile only; unchanged behavior) -->
    <section id="storyMode"></section>
    <div id="storyNext"><span>Next story</span><span class="arrow"></span></div>
  </main>

  <!-- Slide-up menu -->
  <div class="site-menu-overlay" id="siteMenu" hidden>
    <div class="site-menu">
      <button class="menu-close" id="menuClose" aria-label="Close menu">&times;</button>
      <nav class="menu-list">
        <a href="/about.html" class="menu-item">About</a>
        <a href="/contact.html" class="menu-item">Contact</a>
        <a href="https://dexscreener.com/bsc/0x70131b713a5d0e9d900feca15d0e1348658e4444" target="_blank" rel="noopener" class="menu-item">Dex</a>
        <a href="https://x.com/notifaibnb" target="_blank" rel="noopener" class="menu-item">X</a>
        <button type="button" class="menu-item" data-action="change-region">Region</button>
        <button type="button" class="menu-item" id="menuDonate">Donate</button>
      </nav>
    </div>
  </div>

       <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-left">©<span id="yr"></span> NotifAi News</div>
    </div>
  </footer>

  <!-- Region modal (first visit + from footer) -->
  <div id="regionModal" class="region-modal" hidden>
    <div class="region-card">
      <h3>Select your local news region</h3>
      <p>Choose a region to prioritize its Politics/Finance/Entertainment. World & Crypto are global.</p>
      <div class="region-grid">
        <button data-region="us">United States (US)</button>
        <button data-region="cn">China (CN)</button>
        <button data-region="pk">Pakistan (PK)</button>
        <button data-region="id">Indonesia (ID)</button>
        <button data-region="uk">United Kingdom (UK)</button>
        <button data-region="ng">Nigeria (NG)</button>
      </div>
    </div>
  </div>

  <!-- Ethers loader for Donate -->
  <script>
    function ensureEthersLoaded(cb){
      if (window.ethers) return cb();
      const s=document.createElement('script');
      s.src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js";
      s.onload=cb; document.head.appendChild(s);
    }
  </script>

  <script src="/app.js"></script>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>

  <script>
  (function(){
    const overlay = document.getElementById('siteMenu');
    const toggle  = document.getElementById('menuToggle');
    const closeBtn = document.getElementById('menuClose');

    function openMenu(){
      if (!overlay) return;
      overlay.hidden = false;
      overlay.classList.add('open');
      if (toggle) toggle.classList.add('open');
    }
    function closeMenu(){
      if (!overlay) return;
      overlay.classList.remove('open');
      overlay.hidden = true;
      if (toggle) toggle.classList.remove('open');
    }

    if (toggle) toggle.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (overlay){
      overlay.addEventListener('click', function(e){
        if (e.target === overlay) closeMenu();  // click outside drawer closes
      });
    }
  })();
 </script>

</body>
</html>
