<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NotifAi News</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- If your API is on Render with custom domain, set it here -->
  <script>window.API_BASE = window.API_BASE || "https://www.notifai.news";</script>
  <link rel="preconnect" href="https://www.notifai.news" crossorigin>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-row">
      <a class="brand-link" href="/">
        <img class="brand-logo" src="/favicon.png" alt="NotifAi logo" />
        <span class="brand-name">NotifAi News</span>
      </a>
      <nav class="top-links">
        <a class="nav-link" href="https://x.com/notifainews" target="_blank" rel="noopener">X</a>
        <a class="nav-link" href="/about.html">About</a>
      </nav>
    </div>

    <nav class="main-nav" aria-label="Categories">
      <button class="nav-btn active" data-cat="us">US</button>
      <button class="nav-btn" data-cat="world">World</button>
      <button class="nav-btn" data-cat="entertainment">Entertainment</button>
      <button class="nav-btn" data-cat="finance">Finance</button>
    </nav>

    <div class="actions">
      <button id="refreshBtn" title="Fetch fresh stories">↻ Refresh</button>
    </div>
  </header>

  <main class="container">
    <div id="notice" class="notice" hidden></div>

    <!-- lightweight skeletons; replaced by JS -->
    <section id="grid" class="grid">
      <article class="card skeleton"><div class="thumb"></div><div class="meta"><div class="line"></div><div class="line short"></div></div></article>
      <article class="card skeleton"><div class="thumb"></div><div class="meta"><div class="line"></div><div class="line short"></div></div></article>
      <article class="card skeleton"><div class="thumb"></div><div class="meta"><div class="line"></div><div class="line short"></div></div></article>
    </section>
  </main>

  <footer class="site-footer">
    <small>© <span id="year"></span> NotifAi News</small>
    <small><a href="/about.html">About</a></small>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
